apiVersion: apps/v1
kind: Deployment
metadata:
  name: interview-app
  namespace: infrastructure-interview
spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0

  selector:
    matchLabels:
      app: interview-app

  template:
    metadata:
      labels:
        app: interview-app
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: interview-app
      containers:
        - name: app
          image: infrastructure-interview-app:local
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000

          envFrom:
            - configMapRef:
                name: app-config

          env:
            - name: TYPEORM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: username

            - name: TYPEORM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: password

          readinessProbe:
            httpGet:
              path: /posts
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi