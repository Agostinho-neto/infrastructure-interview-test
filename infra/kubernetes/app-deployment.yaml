apiVersion: apps/v1
kind: Deployment
metadata:
  name: interview-app
  namespace: infrastructure-interview
spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0

  selector:
    matchLabels:
      app: interview-app

  template:
    metadata:
      labels:
        app: interview-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: interview-app
      containers:
        - name: app
          image: netoagostinho10/infrastructure-interview-app:1.0.0@sha256:bbcdfedc0e8cca270b43da30950ccf1b47cf9b84e01e67c983417b24664f91c7
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 3000

          envFrom:
            - configMapRef:
                name: app-config

          env:
            - name: TYPEORM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: username

            - name: TYPEORM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: password

          readinessProbe:
            httpGet:
              path: /posts
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
